name: platform-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        # npm ci on a lockfile generated on Windows can omit Rollup's Linux
        # optional package; install from the lockfile while explicitly
        # including optional dependencies on the Linux runner.
        run: npm install --include=optional
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Test API contract
        run: npm run test
